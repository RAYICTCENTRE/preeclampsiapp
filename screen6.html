<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Pre-eclampsia Checker - MotherCare</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #fff5e8 0%, #ffe8d4 100%);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    max-width: 650px;
    width: 100%;
    background: white;
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

h2 {
    color: #d35400;
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 6px;
}

.subtitle {
    text-align: center;
    color: #b86f2c;
    font-size: 13px;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid #ffe0b5;
}

.form-section {
    margin-bottom: 16px;
}

.form-section label {
    display: block;
    font-weight: 600;
    color: #e67e22;
    margin-bottom: 6px;
    font-size: 13px;
    letter-spacing: 0.3px;
}

.form-section label .required {
    color: #e74c3c;
    margin-left: 3px;
}

input, select {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #ffe0b5;
    border-radius: 12px;
    font-size: 14px;
    transition: all 0.2s;
    font-family: inherit;
    background: #fffef7;
}

input:focus, select:focus {
    outline: none;
    border-color: #e67e22;
    box-shadow: 0 0 0 2px rgba(230,126,34,0.1);
}

select[multiple] {
    height: 100px;
}

.readonly-field {
    background: #f5f0e6;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    color: #2c3e50;
    font-weight: 500;
    border: 1px solid #ffe0b5;
}

.or-divider {
    text-align: center;
    margin: 8px 0;
    position: relative;
}

.or-divider::before,
.or-divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 44%;
    height: 1px;
    background: #ffe0b5;
}

.or-divider::before {
    left: 0;
}

.or-divider::after {
    right: 0;
}

.or-divider span {
    background: white;
    padding: 0 10px;
    color: #b86f2c;
    font-size: 11px;
    font-weight: 600;
    position: relative;
    z-index: 1;
}

.symptom-tags {
    background: #fffef7;
    border-radius: 12px;
    padding: 10px;
    margin: 8px 0;
    min-height: 50px;
    border: 1px solid #ffe0b5;
}

.symptom-tags p {
    font-size: 11px;
    color: #b86f2c;
    margin-bottom: 8px;
}

#symptom-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    list-style: none;
}

#symptom-list li {
    background: #e67e22;
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
}

.button-group {
    display: flex;
    gap: 10px;
    margin: 8px 0;
}

.btn {
    flex: 1;
    padding: 8px 12px;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}

.btn-primary {
    background: #e67e22;
    color: white;
}

.btn-primary:hover {
    background: #d35400;
}

.btn-secondary {
    background: #95a5a6;
    color: white;
}

.btn-secondary:hover {
    background: #7f8c8d;
}

.btn-danger {
    background: #e74c3c;
    color: white;
}

.btn-danger:hover {
    background: #c0392b;
}

.checkbox-group {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0;
    padding: 8px;
    background: #fffef7;
    border-radius: 10px;
    border: 1px solid #ffe0b5;
}

.checkbox-group input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: #e67e22;
}

.checkbox-group label {
    margin: 0;
    cursor: pointer;
    font-weight: 500;
    font-size: 12px;
    color: #e67e22;
}

.radio-group {
    display: flex;
    gap: 15px;
    margin-top: 8px;
    padding: 8px;
    background: #fffef7;
    border-radius: 10px;
    border: 1px solid #ffe0b5;
}

.radio-group label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-weight: normal;
    margin: 0;
    font-size: 12px;
    color: #666;
}

.radio-group input[type="radio"] {
    width: 14px;
    height: 14px;
    cursor: pointer;
    accent-color: #e67e22;
}

textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ffe0b5;
    border-radius: 10px;
    font-size: 12px;
    font-family: inherit;
    resize: none;
    margin: 8px 0;
    background: #fffef7;
    height: 100px;
}

textarea:focus {
    outline: none;
    border-color: #e67e22;
}

.two-col {
    display: flex;
    gap: 15px;
}

.two-col > * {
    flex: 1;
}

.short-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 15px 0;
}

.short-btn {
    flex: 0 1 auto;
    padding: 8px 20px;
    border: none;
    border-radius: 30px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}

.short-btn.reset {
    background: #e74c3c;
    color: white;
}

.short-btn.reset:hover {
    background: #c0392b;
}

.short-btn.back {
    background: #3949ab;
    color: white;
}

.short-btn.back:hover {
    background: #303f9f;
}

.short-btn.logout {
    background: #7f8c8d;
    color: white;
}

.short-btn.logout:hover {
    background: #636e72;
}

.disclaimer {
    font-size: 10px;
    color: #b86f2c;
    text-align: center;
    margin-top: 16px;
    padding: 10px;
    background: #fffef7;
    border-radius: 12px;
    border: 1px solid #ffe0b5;
    line-height: 1.4;
}

@media (max-width: 550px) {
    .two-col {
        flex-direction: column;
        gap: 10px;
    }
    
    .short-buttons {
        flex-wrap: wrap;
    }
    
    .short-btn {
        flex: 1;
        text-align: center;
    }
    
    .container {
        padding: 20px;
    }
    
    h2 {
        font-size: 20px;
    }
}
</style>
</head>

<body>
<div class="container">

<h2>Pre-eclampsia Checker</h2>
<p class="subtitle">Early detection saves lives</p>

<form id="form">

<!-- Profile Info - Fetched from database -->
<div class="two-col" style="margin-bottom: 8px;">
    <div class="form-section">
        <label>Weeks pregnant <span class="required">*</span></label>
        <div class="readonly-field" id="gestationalAgeDisplay">Loading...</div>
        <input type="hidden" id="gestational_age_weeks" name="gestational_age_weeks">
    </div>
    
    <div class="form-section">
        <label>Your age <span class="required">*</span></label>
        <div class="readonly-field" id="maternalAgeDisplay">Loading...</div>
        <input type="hidden" id="maternal_age_yrs" name="maternal_age_yrs">
    </div>
</div>

<div class="form-section">
    <label>Diabetes</label>
    <select id="diabetes">
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select>
</div>

<!-- Symptoms Section -->
<div class="two-col">
    <div class="form-section">
        <label>Select symptoms</label>
        <select id="dropdown" multiple size="4">
            <option>Headache</option>
            <option>Swelling</option>
            <option>Blurred vision</option>
            <option>Abdominal pain</option>
            <option>Nausea</option>
        </select>
    </div>
    
    <div class="form-section">
        <div class="or-divider">
            <span>OR</span>
        </div>
        <label>How are you feeling today?</label>
        <input type="text" id="manual" placeholder="Type how you feel...">
    </div>
</div>

<div class="symptom-tags">
    <p>Added symptoms:</p>
    <ul id="symptom-list"></ul>
</div>

<div class="button-group">
    <button type="button" id="add" class="btn btn-primary">Add</button>
    <button type="button" id="clear" class="btn btn-secondary">Clear</button>
</div>

<!-- Clinical Measurements -->
<div class="two-col">
    <div class="form-section">
        <label>Blood Pressure <span class="required">*</span></label>
        <input type="text" id="bp" placeholder="e.g., 120/80" required>
    </div>
    
    <div class="form-section">
        <div class="checkbox-group">
            <input type="checkbox" id="urine">
            <label>Urine test done?</label>
        </div>
    </div>
</div>

<div id="proteinBox" style="display:none;">
    <label>Protein in urine?</label>
    <div class="radio-group">
        <label><input type="radio" name="protein" value="Yes"> Yes</label>
        <label><input type="radio" name="protein" value="No"> No</label>
        <label><input type="radio" name="protein" value="Trace"> Trace</label>
    </div>
</div>

<button type="submit" id="submit" class="btn btn-primary" style="width:100%; margin: 15px 0; padding: 12px; font-size: 16px;">
    Check Risk
</button>

</form>

<textarea id="clinical-note" placeholder="Your results will appear here..."></textarea>

<!-- Short Buttons Row -->
<div class="short-buttons">
    <button type="button" id="reset" class="short-btn reset">Reset</button>
    <button type="button" id="back" class="short-btn back" onclick="window.location.href='dashboard.html'">Back</button>
    <button type="button" id="logout" class="short-btn logout" onclick="window.location.href='screen1.html'">Exit</button>
</div>

<div class="disclaimer">
    ⚠️ This tool is for informational purposes only and does not replace professional medical advice, diagnosis, or treatment. Always consult a qualified healthcare provider.
</div>

</div>

<script>
// ========== GET ELEMENTS ==========
const gestationalAgeDisplay = document.getElementById('gestationalAgeDisplay');
const gestational_age_weeks = document.getElementById('gestational_age_weeks');
const maternalAgeDisplay = document.getElementById('maternalAgeDisplay');
const maternal_age_yrs = document.getElementById('maternal_age_yrs');
const diabetes = document.getElementById('diabetes');
const dropdown = document.getElementById('dropdown');
const manual = document.getElementById('manual');
const list = document.getElementById('symptom-list');
const addBtn = document.getElementById('add');
const clearBtn = document.getElementById('clear');
const bp = document.getElementById('bp');
const urine = document.getElementById('urine');
const proteinBox = document.getElementById('proteinBox');
const resetBtn = document.getElementById('reset');
const clinicalNote = document.getElementById('clinical-note');
const form = document.getElementById('form');

// ========== LOAD PROFILE ==========
async function loadUserProfile() {
    try {
        const res = await fetch('get_user_profile.php');
        const data = await res.json();
        console.log("Profile data:", data);

        if (data.success) {
            const age = data.profile?.age;
            const last_period = data.profile?.last_period;

            if (age && age > 0) {
                maternalAgeDisplay.innerHTML = `${age} years`;
                maternal_age_yrs.value = age;
            } else {
                maternalAgeDisplay.innerHTML = 'Not set - update profile';
            }

            if (last_period) {
                const lastPeriodDate = new Date(last_period);
                const today = new Date();
                const diffDays = Math.floor((today - lastPeriodDate) / (1000 * 60 * 60 * 24));
                const weeks = Math.floor(diffDays / 7);
                
                if (weeks >= 4 && weeks <= 42) {
                    gestationalAgeDisplay.innerHTML = `${weeks} weeks`;
                    gestational_age_weeks.value = weeks;
                } else {
                    gestationalAgeDisplay.innerHTML = 'Invalid date - update profile';
                }
            } else {
                gestationalAgeDisplay.innerHTML = 'Not set - update profile';
            }
        } else {
            gestationalAgeDisplay.innerHTML = 'Please update profile first';
            maternalAgeDisplay.innerHTML = 'Please update profile first';
        }
    } catch (e) {
        console.error('Error loading profile:', e);
        gestationalAgeDisplay.innerHTML = 'Error loading';
        maternalAgeDisplay.innerHTML = 'Error loading';
    }
}

// ========== SYMPTOMS ==========
dropdown.onchange = () => manual.disabled = dropdown.selectedOptions.length > 0;
manual.oninput = () => dropdown.disabled = manual.value.trim() !== "";

urine.onchange = e => {
    proteinBox.style.display = e.target.checked ? "block" : "none";
};

addBtn.onclick = () => {
    [...dropdown.selectedOptions].forEach(o => add(o.value));
    if (manual.value.trim()) {
        manual.value.split(",").forEach(s => add(s.trim()));
        manual.value = "";
    }
};

function add(symptom) {
    if (!symptom) return;
    if (![...list.children].some(li => li.textContent === symptom)) {
        let li = document.createElement("li");
        li.textContent = symptom;
        list.appendChild(li);
    }
}

clearBtn.onclick = () => list.innerHTML = "";

// ========== RESET ==========
resetBtn.onclick = () => {
    list.innerHTML = "";
    manual.value = "";
    dropdown.disabled = false;
    manual.disabled = false;
    [...dropdown.options].forEach(o => o.selected = false);
    bp.value = "";
    urine.checked = false;
    proteinBox.style.display = "none";
    document.querySelectorAll('input[name="protein"]').forEach(r => r.checked = false);
    clinicalNote.value = "";
};


// ============================================
// MOTHERCARE OFFLINE ASSESSMENT SUPPORT
// ============================================
const MC_OFFLINE_DB = 'MotherCareOfflineDB';
const MC_OFFLINE_VERSION = 1;
const MC_OFFLINE_STORE = 'pendingAssessments';

function openMotherCareOfflineDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(MC_OFFLINE_DB, MC_OFFLINE_VERSION);

        req.onupgradeneeded = event => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(MC_OFFLINE_STORE)) {
                db.createObjectStore(MC_OFFLINE_STORE, {keyPath:'client_id'});
            }
        };

        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

async function queueOfflineAssessment(payload) {
    const db = await openMotherCareOfflineDB();

    const client_id = 'mc-' + Date.now() + '-' +
        Math.random().toString(36).slice(2, 10);

    const riskResult = calculateOfflineRisk(payload);

    const record = {
        client_id,
        payload: {
            ...payload,
            risk: riskResult.risk,
            risk_level: riskResult.level,
            message: riskResult.message,
            mode: payload.mode || 'home',
            input_type: payload.input_type || 'checkbox'
        },
        queued_at: new Date().toISOString()
    };

    return new Promise((resolve, reject) => {
        const tx = db.transaction(MC_OFFLINE_STORE, 'readwrite');
        tx.objectStore(MC_OFFLINE_STORE).put(record);
        tx.oncomplete = () => resolve(record);
        tx.onerror = () => reject(tx.error);
    });
}

// Mirrors the current PHP fallback scoring rules used by MotherCare.
// This is for offline continuity only; when synchronized, the record is
// clearly marked "Offline Rule-Based".
function calculateOfflineRisk(payload) {
    const symptoms = Array.isArray(payload.symptoms)
        ? payload.symptoms.join(', ')
        : String(payload.symptoms || '');

    const s = symptoms.toLowerCase();
    let risk = 0;

    if (s.includes('headache')) risk += 15;
    if (s.includes('blurred')) risk += 20;
    if (s.includes('swelling')) risk += 12;
    if (s.includes('abdominal')) risk += 12;
    if (s.includes('nausea')) risk += 8;

    const systolic = Number(payload.systolic_bp || 0);
    const diastolic = Number(payload.diastolic_bp || 0);

    if (systolic > 0 && diastolic > 0) {
        if (systolic >= 160 || diastolic >= 110) risk += 30;
        else if (systolic >= 140 || diastolic >= 90) risk += 20;
        else if (systolic >= 130 || diastolic >= 85) risk += 10;
    }

    if (Number(payload.diabetes) === 1) risk += 8;
    if (Number(payload.previous_pe) === 1) risk += 10;
    if (Number(payload.multiple_pregnancy) === 1) risk += 8;
    if (Number(payload.hypertension) === 1) risk += 8;
    if (Number(payload.maternal_age_yrs) >= 35) risk += 8;
    if (Number(payload.gestational_age_weeks) >= 20) risk += 5;

    risk = Math.min(risk, 100);

    let level;
    let message;

    if (risk < 25) {
        level = 'Low';
        message = `LOW RISK\\n\\nRisk Score: ${risk}%\\n\\nContinue routine antenatal care.\\nMonitor blood pressure weekly.\\nWatch for new symptoms.`;
    } else if (risk < 55) {
        level = 'Moderate';
        message = `MODERATE RISK\\n\\nRisk Score: ${risk}%\\n\\nCheck BP DAILY.\\nMonitor warning signs.\\nArrange antenatal follow-up.`;
    } else {
        level = 'High';
        message = `HIGH RISK\\n\\nRisk Score: ${risk}%\\n\\nSeek medical evaluation promptly.\\nMonitor vital signs.\\nDo not delay care if symptoms worsen.`;
    }

    return {risk, level, message};
}

async function saveAssessmentOffline(payload) {
    const record = await queueOfflineAssessment(payload);

    const result = calculateOfflineRisk(record.payload);

    clinicalNote.value =
        "OFFLINE ASSESSMENT SAVED\n\n" +
        "Risk Score: " + result.risk + "%\n" +
        "Risk Level: " + result.level + "\n\n" +
        result.message +
        "\n\n✓ Saved securely on this device.\n✓ Will synchronize automatically when Internet returns.";

    if (typeof aiStatus !== 'undefined' && aiStatus) {
        aiStatus.className = 'ai-fallback';
        aiStatus.innerHTML = '📱 Offline assessment — saved for synchronization';
        aiStatus.style.display = 'block';
    }
}

// ========== SUBMIT FORM ==========
form.onsubmit = async (e) => {
    e.preventDefault();

    const symptoms = [...list.children].map(li => li.textContent);
    if (symptoms.length === 0) {
        alert("Please add symptoms first");
        return;
    }

    const gest = gestational_age_weeks.value;
    const age = maternal_age_yrs.value;

    if (!gest || !age) {
        alert("Please complete your profile first (Age and Weeks pregnant required)");
        return;
    }

    let bpValue = bp.value.trim();
    if (!bpValue) {
        alert("Please enter blood pressure");
        return;
    }

    let parts = bpValue.split(/[\/, -]/).map(Number).filter(n => !isNaN(n));
    if (parts.length < 2) {
        alert("Please enter BP like 120/80");
        return;
    }

    let systolic = parts[0];
    let diastolic = parts[1];

    // FIXED: Better radio button detection
    let protein = "None";
    
    if (urine.checked) {
        // Get all radio buttons with name="protein"
        const radioButtons = document.querySelectorAll('input[name="protein"]');
        let selectedValue = null;
        
        for (let radio of radioButtons) {
            if (radio.checked) {
                selectedValue = radio.value;
                break;
            }
        }
        
        if (selectedValue) {
            protein = selectedValue;
        }
    }
    
    // Debug - log what was selected
    console.log("Urine checkbox checked:", urine.checked);
    console.log("Selected protein value:", protein);

    const payload = {
        symptoms: symptoms,
        systolic_bp: systolic,
        diastolic_bp: diastolic,
        proteinuria: protein,
        gestational_age_weeks: parseFloat(gest),
        maternal_age_yrs: parseInt(age),
        diabetes: parseInt(diabetes.value)
    };

    console.log("Full payload:", payload);

    if (!navigator.onLine) {
        try {
            await saveAssessmentOffline(payload);
        } catch (error) {
            console.error("Offline save error:", error);
            alert("The assessment could not be saved offline.");
        }
        return;
    }

    try {
        const response = await fetch("post_symptom_data.php", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error("Server returned " + response.status);

        const data = await response.json();

        if (data.error) {
            alert(data.error);
            return;
        }

        clinicalNote.value =
            "Risk Score: " + data.risk + "\n" +
            "Risk Level: " + data.level + "\n" +
            "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n" +
            (data.note || data.advice || data.message || "");

    } catch (error) {
        console.warn("Online submission failed; saving locally:", error);

        try {
            await saveAssessmentOffline(payload);
        } catch (offlineError) {
            console.error("Offline save error:", offlineError);
            alert("The assessment could not be sent or saved offline.");
        }
    }
};
// ========== OFFLINE APP SHELL ==========
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(err => {
            console.warn('MotherCare service worker registration failed:', err);
        });
    });
}

// ========== LOAD PROFILE ON PAGE LOAD ==========
loadUserProfile();
</script>

</body>
</html>
