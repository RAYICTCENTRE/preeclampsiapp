<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>My Profile - MotherCare</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fff5e8 0%, #ffe8d4 100%);
            font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

        }

        .progress-section {

        }

        .progress-label {
            display: flex;

        }

        .progress {

            height: 6px;

        }

        .progress-bar {

            gap: 12px;

            font-size: 13px;

        .form-row input,

            width: 68%;

            background: #fefcf8;

        .form-row input:focus,

        .form-row input[readonly] {

        .phone-row {
            display: flex;

        .phone-row select {
            width: 40%;
            padding: 8px 10px;

        .phone-row input {
            width: 60%;
            padding: 8px 12px;
        }

        .readonly-value {
            width: 68%;
            padding: 8px 12px;
            background: #f1f5f9;
            border-radius: 10px;

            color: #1e293b;
            font-weight: 500;
        }

            gap: 10px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;

        }

        .btn-primary:hover {

            box-shadow: 0 4px 12px rgba(230,126,34,0.35);
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .btn-warning:hover {
            background: #d97706;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        small {
            font-size: 10px;
            color: #b86f2c;
            margin-left: 8px;
        }

        @media (max-width: 640px) {
            .form-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
            
            .form-row label {
                width: 100%;
            }
            
            .form-row input,
            .form-row select,
            .readonly-value,
            .phone-row {
                width: 100%;
            }

                flex-direction: row;
            }

                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="profile-container">
    <div class="header">
        <h1>My Profile</h1>

    </div>

    <div class="progress-section">

    <form id="profileForm" action="save_profile.php" method="POST">
        <div class="form-content">
            <!-- Basic Info -->

            <div class="form-row">

            </div>
            
            <div class="form-row">

<div class="form-row">

<script>
// Fetch user data from server
async function loadUserData() {
    try {
        const response = await fetch('get_user_profile.php');
        const data = await response.json();
        
        console.log("Profile data received:", data); // Check console
        
        if (data.success) {
            // Fill readonly fields
            document.getElementById('displayFirstname').innerHTML = data.firstname || '';
            document.getElementById('displayLastname').innerHTML = data.lastname || '';
            document.getElementById('displayEmail').innerHTML = data.email || '';

            
            // Fill profile data if exists
            if (data.profile) {
                document.getElementById('age').value = data.profile.age || '';
                document.getElementById('nationality').value = data.profile.nationality || '';
                document.getElementById('nearestHealth').value =
                    data.profile.nearest_health || '';

                // Restore cascading address selections.
                if (data.profile.district) {
                    districtSelect.value = data.profile.district;

                    await loadLocationLevel(
                        'subcounties',
                        data.profile.district,
                        subCountySelect,
                        'Select sub county/town council'
                    );

                    if (data.profile.sub_county) {
                        subCountySelect.value = data.profile.sub_county;

                        await loadLocationLevel(
                            'parishes',
                            data.profile.sub_county,
                            parishSelect,
                            'Select parish/ward'
                        );
                    }

                    if (data.profile.parish) {
                        parishSelect.value = data.profile.parish;

                        await loadLocationLevel(
                            'villages',
                            data.profile.parish,
                            villageSelect,
                            'Select village'
                        );
                    }

                    if (data.profile.village) {
                        villageSelect.value = data.profile.village;
                    }
                }
                document.getElementById('kinName').value = data.profile.kin_name || '';
                document.getElementById('kinRelationship').value = data.profile.kin_relationship || '';
                
                // Handle kin phone
                if (data.profile.kin_contact) {
                    const kinMatch = data.profile.kin_contact.match(/^(\+[0-9]+)(.*)$/);
                    if (kinMatch) {
                        document.getElementById('kinCountryCode').value = kinMatch[1];
                        document.getElementById('kinContact').value = kinMatch[2];
                    } else {
                        document.getElementById('kinContact').value = data.profile.kin_contact;
                    }
                }
                
                // Handle pregnancy dates
                if (data.profile.last_period) {
                    document.getElementById('lastPeriod').value = data.profile.last_period;
                    
                    // Calculate due date
                    const lastPeriod = new Date(data.profile.last_period);
                    const dueDate = new Date(lastPeriod);
                    dueDate.setDate(dueDate.getDate() + 280);
                    document.getElementById('expectedDelivery').value = dueDate.toISOString().split('T')[0];
                    
                    // Calculate weeks
                    const today = new Date();
                    const diffDays = Math.floor((today - lastPeriod) / (1000 * 60 * 60 * 24));
                    const weeks = Math.floor(diffDays / 7);
                    if (weeks >= 0 && weeks <= 42) {
                        document.getElementById('weeksPregnant').value = weeks + " weeks";
                    }
                }
            }
        }
        updateProgress();
    } catch (error) {
        console.error('Error loading profile:', error);
        document.getElementById('displayFirstname').innerHTML = 'Error loading';
        document.getElementById('displayLastname').innerHTML = 'Error loading';
        document.getElementById('displayEmail').innerHTML = 'Error loading';
    }
}


/* ==========================================================
   CASCADING UGANDA LOCATION SELECTIONS
   ==========================================================

   The page expects a backend endpoint named:
       uganda_locations.php

   Supported actions:
       ?action=districts
       ?action=subcounties&parent=...
       ?action=parishes&parent=...
       ?action=villages&parent=...

   This keeps the district → sub-county → parish → village
   choices controlled by your Uganda administrative data.
========================================================== */

const districtSelect = document.getElementById('district');
const subCountySelect = document.getElementById('subCounty');
const parishSelect = document.getElementById('parish');
const villageSelect = document.getElementById('village');

const nearestHealthInput = document.getElementById('nearestHealth');
const locationStatus = document.getElementById('locationStatus');
const refreshFacilityBtn = document.getElementById('refreshFacilityBtn');


async function loadUgandaDistricts() {

    districtSelect.innerHTML =
        '<option value="">Loading districts...</option>';

    districtSelect.disabled = true;

    try {

        const response = await fetch(
            'uganda_locations.php?action=districts'
        );

        if (!response.ok) {
            throw new Error('District service unavailable');
        }

        const result = await response.json();

        if (!result.success || !Array.isArray(result.data)) {
            throw new Error('Invalid district data');
        }

        districtSelect.innerHTML =
            '<option value="">Select district</option>';

        result.data.forEach(function(item) {

            const option = document.createElement('option');

            option.value = item.name;
            option.textContent = item.name;

            districtSelect.appendChild(option);
        });

        districtSelect.disabled = false;

    } catch (error) {

        console.error('District loading error:', error);

        districtSelect.innerHTML =
            '<option value="">Unable to load districts</option>';

        locationStatus.textContent =
            'Unable to load Uganda locations. Please try again.';
    }
}


async function loadLocationLevel(
    level,
    parentName,
    targetSelect,
    placeholder
) {

    targetSelect.innerHTML =
        '<option value="">Loading...</option>';

    targetSelect.disabled = true;

    try {

        const response = await fetch(
            'uganda_locations.php?action=' +
            encodeURIComponent(level) +
            '&parent=' +
            encodeURIComponent(parentName)
        );

        if (!response.ok) {
            throw new Error(level + ' service unavailable');
        }

        const result = await response.json();

        if (!result.success || !Array.isArray(result.data)) {
            throw new Error('Invalid ' + level + ' data');
        }

        targetSelect.innerHTML =
            '<option value="">' +
            placeholder +
            '</option>';

        result.data.forEach(function(item) {

            const option = document.createElement('option');

            option.value = item.name;
            option.textContent = item.name;

            targetSelect.appendChild(option);
        });

        targetSelect.disabled = false;

    } catch (error) {

        console.error(level + ' loading error:', error);

        targetSelect.innerHTML =
            '<option value="">Unable to load locations</option>';

        targetSelect.disabled = true;
    }
}


/* District → Sub County/Town Council */
districtSelect.addEventListener('change', async function() {

    const district = this.value;

    subCountySelect.innerHTML =
        '<option value="">Select district first</option>';

    parishSelect.innerHTML =
        '<option value="">Select sub county first</option>';

    villageSelect.innerHTML =
        '<option value="">Select parish first</option>';

    subCountySelect.disabled = true;
    parishSelect.disabled = true;
    villageSelect.disabled = true;

    if (!district) {
        updateProgress();
        return;
    }

    await loadLocationLevel(
        'subcounties',
        district,
        subCountySelect,
        'Select sub county/town council'
    );

    updateProgress();
});


/* Sub County/Town Council → Parish/Ward */
subCountySelect.addEventListener('change', async function() {

    const subCounty = this.value;

    parishSelect.innerHTML =
        '<option value="">Select sub county first</option>';

    villageSelect.innerHTML =
        '<option value="">Select parish first</option>';

    parishSelect.disabled = true;
    villageSelect.disabled = true;

    if (!subCounty) {
        updateProgress();
        return;
    }

    await loadLocationLevel(
        'parishes',
        subCounty,
        parishSelect,
        'Select parish/ward'
    );

    updateProgress();
});


/* Parish/Ward → Village */
parishSelect.addEventListener('change', async function() {

    const parish = this.value;

    villageSelect.innerHTML =
        '<option value="">Select parish first</option>';

    villageSelect.disabled = true;

    if (!parish) {
        updateProgress();
        return;
    }

    await loadLocationLevel(
        'villages',
        parish,
        villageSelect,
        'Select village'
    );

    updateProgress();
});


/* ==========================================================
   NEAREST HEALTH FACILITY
   ==========================================================

   The browser obtains the user's current coordinates.
   Those coordinates are sent to:
       nearest_health_facility.php

   That endpoint should query your health-facility source.

   Because the user's location can change, this function can
   be called every time the profile/app is opened.
========================================================== */

async function updateNearestHealthFacility() {

    if (!navigator.geolocation) {

        locationStatus.textContent =
            'Location services are not supported on this device.';

        return;
    }

    nearestHealthInput.value = '';

    locationStatus.textContent =
        '📍 Getting your current location...';

    refreshFacilityBtn.disabled = true;

    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            locationStatus.textContent =
                '🔎 Finding the nearest health facility...';

            try {

                const response = await fetch(
                    'nearest_health_facility.php',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({
                            latitude: latitude,
                            longitude: longitude
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        'Health facility service unavailable'
                    );
                }

                const result =
                    await response.json();

                if (
                    result.success &&
                    result.facility
                ) {

                    nearestHealthInput.value =
                        result.facility.name;

                    locationStatus.textContent =
                        '📍 Nearest facility updated from your current location.';

                    saveLocationCoordinates(
                        latitude,
                        longitude
                    );

                } else {

                    locationStatus.textContent =
                        'No nearby health facility was found.';

                }

            } catch (error) {

                console.error(
                    'Nearest facility error:',
                    error
                );

                locationStatus.textContent =
                    'Unable to find the nearest health facility. Please try again.';

            } finally {

                refreshFacilityBtn.disabled = false;

                updateProgress();
            }
        },

        function(error) {

            refreshFacilityBtn.disabled = false;

            console.error(
                'Geolocation error:',
                error
            );

            if (
                error.code ===
                error.PERMISSION_DENIED
            ) {

                locationStatus.textContent =
                    'Location permission was denied. Allow location access to find your nearest facility.';

            } else {

                locationStatus.textContent =
                    'Could not determine your location. Please try again.';
            }
        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 300000
        }
    );
}


/* Save current coordinates as hidden fields */
function saveLocationCoordinates(
    latitude,
    longitude
) {

    let latInput =
        document.getElementById('currentLatitude');

    let lngInput =
        document.getElementById('currentLongitude');

    if (!latInput) {

        latInput =
            document.createElement('input');

        latInput.type = 'hidden';
        latInput.name = 'current_latitude';
        latInput.id = 'currentLatitude';

        form.appendChild(latInput);
    }

    if (!lngInput) {

        lngInput =
            document.createElement('input');

        lngInput.type = 'hidden';
        lngInput.name = 'current_longitude';
        lngInput.id = 'currentLongitude';

        form.appendChild(lngInput);
    }

    latInput.value = latitude;
    lngInput.value = longitude;
}


/* Manual nearest-facility refresh */
refreshFacilityBtn.addEventListener(
    'click',
    updateNearestHealthFacility
);


const form = document.getElementById('profileForm');
const progressBar = document.getElementById('progressBar');
const progressPercent = document.getElementById('progressPercent');


/* Normalize emergency contact phone before saving */
document.getElementById('profileForm').addEventListener(
    'submit',
    function() {

        const kinCode =
            document.getElementById('kinCountryCode').value;

        const kinInput =
            document.getElementById('kinContact');

        if (
            kinInput &&
            kinInput.value.trim() !== ''
        ) {

            let kinPhone =
                kinInput.value.replace(/\D/g, '');

            kinPhone =
                kinPhone.replace(/^0+/, '');

            if (kinPhone) {

                kinInput.value =
                    kinCode + kinPhone;
            }
        }
    }
);


// Calculate weeks pregnant and due date
function calculateWeeksAndDueDate(lastPeriodDate) {
    const lastPeriod = new Date(lastPeriodDate);
    const today = new Date();
    const diffTime = today - lastPeriod;
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
    const weeks = Math.floor(diffDays / 7);
    return weeks;
}

// Update due date and weeks pregnant
document.getElementById("lastPeriod").addEventListener("change", function () {
    if (this.value) {
        const d = new Date(this.value);
        d.setDate(d.getDate() + 280);
        document.getElementById("expectedDelivery").value = d.toISOString().split('T')[0];
        
        const weeks = calculateWeeksAndDueDate(this.value);
        if (weeks >= 0 && weeks <= 42) {
            document.getElementById("weeksPregnant").value = weeks + " weeks";
        } else if (weeks < 0) {
            document.getElementById("weeksPregnant").value = "Please enter a valid date";
        } else {
            document.getElementById("weeksPregnant").value = "Overdue - please consult doctor";
        }
        updateProgress();
    }
});

// Clear form
document.getElementById('clear-btn').onclick = () => {
    form.reset();
    document.getElementById("expectedDelivery").value = "";
    document.getElementById("weeksPregnant").value = "";
    updateProgress();
};

// Cancel → dashboard
document.getElementById('cancel-btn').onclick = () => {
    window.location.href = 'dashboard.html';
};

// Update progress percentage
function updateProgress() {
    const inputs = form.querySelectorAll('input, select');
    let filled = 0;
    let total = 0;
    
    inputs.forEach(input => {
        if (!input.hasAttribute('readonly')) {
            total++;
            if (input.value && input.value.trim() !== '') {
                filled++;
            }
        }
    });
    
    const percent = Math.round((filled / total) * 100);
    progressBar.style.width = percent + '%';
    progressPercent.textContent = percent + '%';
}

// Add event listeners
form.querySelectorAll('input, select').forEach(input => {
    if (!input.hasAttribute('readonly')) {
        input.addEventListener('input', updateProgress);
        input.addEventListener('change', updateProgress);
    }
});
