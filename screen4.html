<script>
// Fetch user data from server
async function loadUserData() {
    try {
        const response = await fetch('get_user_profile.php');
        const data = await response.json();
        
        console.log("Profile data received:", data); // Check console
        
        if (data.success) {
            // Fill readonly fields
            document.getElementById('displayFirstname').innerHTML = data.firstname || '';
            document.getElementById('displayLastname').innerHTML = data.lastname || '';
            document.getElementById('displayEmail').innerHTML = data.email || '';

            
            // Fill profile data if exists
            if (data.profile) {
                document.getElementById('age').value = data.profile.age || '';
                document.getElementById('nationality').value = data.profile.nationality || '';
                document.getElementById('nearestHealth').value =
                    data.profile.nearest_health || '';
                // Restore saved cascading address selections by name.
                async function restoreLocationSelection() {

                    function selectByName(select, name) {

                        if (!select || !name) {
                            return false;
                        }

                        const wanted =
                            name.trim().toLowerCase();

                        for (
                            let i = 0;
                            i < select.options.length;
                            i++
                        ) {

                            const option =
                                select.options[i];

                            const optionName =
                                (
                                    option.dataset.name ||
                                    option.textContent ||
                                    ''
                                ).trim().toLowerCase();

                            if (optionName === wanted) {

                                select.selectedIndex = i;

                                return true;
                            }
                        }

                        return false;
                    }

                    if (!data.profile.district) {
                        return;
                    }

                    /*
                     * District/city.
                     */
                    const districtFound =
                        selectByName(
                            districtSelect,
                            data.profile.district
                        );

                    if (!districtFound) {
                        return;
                    }

                    districtSelect.dispatchEvent(
                        new Event('change')
                    );

                    /*
                     * Wait for counties/municipalities.
                     */
                    let attempts = 0;

                    while (
                        countySelect.disabled &&
                        attempts < 30
                    ) {

                        await new Promise(
                            resolve =>
                                setTimeout(resolve, 150)
                        );

                        attempts++;
                    }

                    if (data.profile.county) {

                        selectByName(
                            countySelect,
                            data.profile.county
                        );

                        countySelect.dispatchEvent(
                            new Event('change')
                        );

                        attempts = 0;

                        while (
                            subCountySelect.disabled &&
                            attempts < 30
                        ) {

                            await new Promise(
                                resolve =>
                                    setTimeout(resolve, 150)
                            );

                            attempts++;
                        }
                    }

                    /*
                     * Subcounty/town council/division.
                     */
                    if (data.profile.sub_county) {

                        selectByName(
                            subCountySelect,
                            data.profile.sub_county
                        );

                        subCountySelect.dispatchEvent(
                            new Event('change')
                        );

                        attempts = 0;

                        while (
                            parishSelect.disabled &&
                            attempts < 30
                        ) {

                            await new Promise(
                                resolve =>
                                    setTimeout(resolve, 150)
                            );

                            attempts++;
                        }
                    }

                    /*
                     * Parish/ward.
                     */
                    if (data.profile.parish) {

                        selectByName(
                            parishSelect,
                            data.profile.parish
                        );

                        parishSelect.dispatchEvent(
                            new Event('change')
                        );

                        attempts = 0;

                        while (
                            villageSelect.disabled &&
                            attempts < 30
                        ) {

                            await new Promise(
                                resolve =>
                                    setTimeout(resolve, 150)
                            );

                            attempts++;
                        }
                    }

                    /*
                     * Village/cell/zone.
                     */
                    if (data.profile.village) {

                        selectByName(
                            villageSelect,
                            data.profile.village
                        );
                    }
                }

                await restoreLocationSelection();

                document.getElementById('kinName').value = data.profile.kin_name || '';
                document.getElementById('kinRelationship').value = data.profile.kin_relationship || '';
                
                // Handle kin phone
                if (data.profile.kin_contact) {
                    const kinMatch = data.profile.kin_contact.match(/^(\+[0-9]+)(.*)$/);
                    if (kinMatch) {
                        document.getElementById('kinCountryCode').value = kinMatch[1];
                        document.getElementById('kinContact').value = kinMatch[2];
                    } else {
                        document.getElementById('kinContact').value = data.profile.kin_contact;
                    }
                }
                
                // Handle pregnancy dates
                if (data.profile.last_period) {
                    document.getElementById('lastPeriod').value = data.profile.last_period;
                    
                    // Calculate due date
                    const lastPeriod = new Date(data.profile.last_period);
                    const dueDate = new Date(lastPeriod);
                    dueDate.setDate(dueDate.getDate() + 280);
                    document.getElementById('expectedDelivery').value = dueDate.toISOString().split('T')[0];
                    
                    // Calculate weeks
                    const today = new Date();
                    const diffDays = Math.floor((today - lastPeriod) / (1000 * 60 * 60 * 24));
                    const weeks = Math.floor(diffDays / 7);
                    if (weeks >= 0 && weeks <= 42) {
                        document.getElementById('weeksPregnant').value = weeks + " weeks";
                    }
                }
            }
        }
        updateProgress();
    } catch (error) {
        console.error('Error loading profile:', error);
        document.getElementById('displayFirstname').innerHTML = 'Error loading';
        document.getElementById('displayLastname').innerHTML = 'Error loading';
        document.getElementById('displayEmail').innerHTML = 'Error loading';
    }
}


/* ==========================================================

       ?action=parishes&parent=...

function populateFallbackDistricts() {

    districtSelect.innerHTML =
        '<option value="">Select district</option>';

    ugandaDistrictFallback.sort().forEach(function(name) {

        const option =
            document.createElement('option');

        option.value = name;
        option.textContent = name;

        districtSelect.appendChild(option);
    });

    districtSelect.disabled = false;
}

/*
 * Important:
 * We don't lock the user out if the backend location
 * endpoint fails. The user can still select/enter a
 * location through the available controls.
 */

async function loadUgandaDistricts() {

    districtSelect.innerHTML =
        '<option value="">Loading Uganda locations...</option>';

    districtSelect.disabled = true;

    try {

        const [districtResponse, cityResponse] =
            await Promise.all([
                fetch('https://uganda-omega.vercel.app/api/districts'),
                fetch('https://uganda-omega.vercel.app/api/cities')
            ]);

        if (!districtResponse.ok || !cityResponse.ok) {
            throw new Error('Location API unavailable');
        }

        const districtResult =
            await districtResponse.json();

        const cityResult =
            await cityResponse.json();

        const districts =
            Array.isArray(districtResult)
                ? districtResult
                : (districtResult.data || []);

        const cities =
            Array.isArray(cityResult)
                ? cityResult
                : (cityResult.data || []);

        const allLocations = [];

        districts.forEach(function(item) {

            allLocations.push({
                id: item.id,
                name: item.name,
                type: 'District'
            });
        });

        cities.forEach(function(item) {

            allLocations.push({
                id: item.id,
                name: item.name,
                type: 'City'
            });
        });

        if (!allLocations.length) {
            throw new Error('No locations returned');
        }

        allLocations.sort(function(a, b) {

            return a.name.localeCompare(
                b.name,
                undefined,
                { sensitivity: 'base' }
            );
        });

        districtSelect.innerHTML =
            '<option value="">Select district or city</option>';

        allLocations.forEach(function(item) {

            const option =
                document.createElement('option');

            /*
             * Store the real API ID, not just the name.
             * This prevents similarly named locations from
             * being mixed up.
             */
            option.value = item.id;

            option.dataset.name = item.name;
            option.dataset.type = item.type;

            option.textContent =
                item.name + ' (' + item.type + ')';

            districtSelect.appendChild(option);
        });

        districtSelect.disabled = false;

    } catch (error) {

        console.error(
            'Current Uganda location API error:',
            error
        );

        districtSelect.innerHTML =
            '<option value="">Unable to load locations</option>';

        districtSelect.disabled = false;

        locationStatus.textContent =
            'Unable to load the latest Uganda location list. Please refresh and try again.';
    }
}

async function loadLocationLevel(
    level,
    parentId,
    targetSelect,
    placeholder
) {

    targetSelect.innerHTML =
        '<option value="">' +
        placeholder +
        '</option>';

    targetSelect.disabled = true;

    if (!parentId) {
        targetSelect.disabled = false;
        return;
    }

    try {

        let endpoint = '';

        /*
         * Current API hierarchy:
         *
         * district/city → /api/units/:id
         * county       → /api/counties/:id/subcounties
         * subcounty    → /api/subcounties/:id/parishes
         * parish       → /api/units/:id
         */

        if (level === 'children') {

            endpoint =
                'https://uganda-omega.vercel.app/api/units/' +
                encodeURIComponent(parentId);

        } else if (level === 'subcounties') {

            endpoint =
                'https://uganda-omega.vercel.app/api/counties/' +
                encodeURIComponent(parentId) +
                '/subcounties';

        } else if (level === 'parishes') {

            endpoint =
                'https://uganda-omega.vercel.app/api/subcounties/' +
                encodeURIComponent(parentId) +
                '/parishes';

        } else {

            throw new Error(
                'Unknown location level: ' + level
            );
        }

        const response =
            await fetch(endpoint);

        if (!response.ok) {
            throw new Error(
                'Location request failed: ' +
                response.status
            );
        }

        const result =
            await response.json();

        /*
         * /api/units/:id returns a unit object with direct
         * children. Other endpoints return arrays.
         */
        let records = [];

        if (Array.isArray(result)) {

            records = result;

        } else if (Array.isArray(result.data)) {

            records = result.data;

        } else if (Array.isArray(result.children)) {

            records = result.children;

        } else if (
            result.unit &&
            Array.isArray(result.unit.children)
        ) {

            records = result.unit.children;
        }

        if (!records.length) {

            targetSelect.innerHTML =
                '<option value="">No locations found</option>';

            targetSelect.disabled = false;

            return;
        }

        targetSelect.innerHTML =
            '<option value="">' +
            placeholder +
            '</option>';

        records.sort(function(a, b) {

            const aName =
                a.name ||
                a.name_en ||
                a.label ||
                '';

            const bName =
                b.name ||
                b.name_en ||
                b.label ||
                '';

            return aName.localeCompare(
                bName,
                undefined,
                { sensitivity: 'base' }
            );
        });

        records.forEach(function(item) {

            const option =
                document.createElement('option');

            const itemId =
                item.id ||
                item.uuid ||
                item.value;

            const itemName =
                item.name ||
                item.name_en ||
                item.label;

                    direct.data ||
                    [];

            countySelect.innerHTML =
                '<option value="">No county/municipality tier</option>';

/* ==========================================================
   NEAREST HEALTH FACILITY
   ==========================================================

   The browser obtains the user's current coordinates.
   Those coordinates are sent to:
       nearest_health_facility.php

   That endpoint should query your health-facility source.

   Because the user's location can change, this function can
   be called every time the profile/app is opened.
========================================================== */

async function updateNearestHealthFacility() {

    if (!navigator.geolocation) {

        locationStatus.textContent =
            'Location services are not supported on this device.';

        return;
    }

    nearestHealthInput.value = '';

    locationStatus.textContent =
        '📍 Getting your current location...';

    refreshFacilityBtn.disabled = true;

    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            locationStatus.textContent =
                '🔎 Searching for nearby health facilities...';

            try {

                /*
                 * OpenStreetMap Overpass is used here instead of
                 * simply guessing a facility from the district.
                 *
                 * We search several healthcare-related OSM tags,
                 * then calculate the actual straight-line distance
                 * from the user's GPS position and select the
                 * closest result.
                 */
                const radius =
                    15000;

                const query = `
[out:json][timeout:25];
(
  nwr["amenity"="hospital"](around:${radius},${latitude},${longitude});
  nwr["amenity"="clinic"](around:${radius},${latitude},${longitude});
  nwr["amenity"="doctors"](around:${radius},${latitude},${longitude});
  nwr["healthcare"](around:${radius},${latitude},${longitude});
);
out center tags;
`;

                const endpoint =
                    'https://overpass-api.de/api/interpreter?data=' +
                    encodeURIComponent(query);

                const response =
                    await fetch(endpoint);

                if (!response.ok) {
                    throw new Error(
                        'Nearby health facility service unavailable'
                    );
                }

                const result =
                    await response.json();

                const elements =
                    Array.isArray(result.elements)
                        ? result.elements
                        : [];

                if (!elements.length) {

                    throw new Error(
                        'No nearby facilities found'
                    );
                }

                function getCoordinates(element) {

                    if (
                        typeof element.lat === 'number' &&
                        typeof element.lon === 'number'
                    ) {

                        return {
                            lat: element.lat,
                            lon: element.lon
                        };
                    }

                    if (
                        element.center &&
                        typeof element.center.lat === 'number' &&
                        typeof element.center.lon === 'number'
                    ) {

                        return {
                            lat: element.center.lat,
                            lon: element.center.lon
                        };
                    }

                    return null;
                }


                function distanceKm(
                    lat1,
                    lon1,
                    lat2,
                    lon2
                ) {

                    const earthRadius =
                        6371;

                    const dLat =
                        (
                            lat2 - lat1
                        ) *
                        Math.PI /
                        180;

                    const dLon =
                        (
                            lon2 - lon1
                        ) *
                        Math.PI /
                        180;

                    const a =
                        Math.sin(dLat / 2) *
                        Math.sin(dLat / 2) +
                        Math.cos(
                            lat1 *
                            Math.PI /
                            180
                        ) *
                        Math.cos(
                            lat2 *
                            Math.PI /
                            180
                        ) *
                        Math.sin(dLon / 2) *
                        Math.sin(dLon / 2);

                    const c =
                        2 *
                        Math.atan2(
                            Math.sqrt(a),
                            Math.sqrt(1 - a)
                        );

                    return earthRadius * c;
                }


                const facilities =
                    elements
                    .map(function(element) {

                        const coordinates =
                            getCoordinates(element);

                        if (!coordinates) {
                            return null;
                        }

                        const tags =
                            element.tags || {};

                        const name =
                            tags.name ||
                            tags['name:en'] ||
                            tags.healthcare ||
                            tags.amenity ||
                            'Health Facility';

                        const distance =
                            distanceKm(
                                latitude,
                                longitude,
                                coordinates.lat,
                                coordinates.lon
                            );

                        return {
                            name: name,
                            distance: distance,
                            latitude:
                                coordinates.lat,
                            longitude:
                                coordinates.lon,
                            type:
                                tags.healthcare ||
                                tags.amenity ||
                                ''
                        };

                    })
                    .filter(Boolean);


                if (!facilities.length) {

                    throw new Error(
                        'No mappable facilities found'
                    );
                }


                /*
                 * Closest facility first.
                 */
                facilities.sort(
                    function(a, b) {
                        return a.distance -
                               b.distance;
                    }
                );


                const nearest =
                    facilities[0];


                nearestHealthInput.value =
                    nearest.name;


                const roundedDistance =
                    nearest.distance < 1
                        ? Math.round(
                            nearest.distance * 1000
                          ) + ' m'
                        : nearest.distance.toFixed(1) + ' km';


                locationStatus.textContent =
                    '📍 ' +
                    nearest.name +
                    ' (' +
                    roundedDistance +
                    ' away)';


                saveLocationCoordinates(
                    latitude,
                    longitude
                );


                /*
                 * Keep the selected facility's coordinates
                 * available for save_profile.php.
                 */
                let facilityLat =
                    document.getElementById(
                        'nearestFacilityLatitude'
                    );

                let facilityLng =
                    document.getElementById(
                        'nearestFacilityLongitude'
                    );

                if (!facilityLat) {

                    facilityLat =
                        document.createElement('input');

                    facilityLat.type =
                        'hidden';

                    facilityLat.name =
                        'nearest_facility_latitude';

                    facilityLat.id =
                        'nearestFacilityLatitude';

                    form.appendChild(
                        facilityLat
                    );
                }

                if (!facilityLng) {

                    facilityLng =
                        document.createElement('input');

                    facilityLng.type =
                        'hidden';

                    facilityLng.name =
                        'nearest_facility_longitude';

                    facilityLng.id =
                        'nearestFacilityLongitude';

                    form.appendChild(
                        facilityLng
                    );
                }

                facilityLat.value =
                    nearest.latitude;

                facilityLng.value =
                    nearest.longitude;

            } catch (error) {

                console.error(
                    'Nearest facility error:',
                    error
                );

                locationStatus.textContent =
                    'Unable to identify a nearby health facility. Tap "Update nearest facility" to try again.';

            } finally {

                refreshFacilityBtn.disabled =
                    false;

                updateProgress();
            }
        },

        function(error) {

            refreshFacilityBtn.disabled =
                false;

            console.error(
                'Geolocation error:',
                error
            );

            if (
                error.code ===
                error.PERMISSION_DENIED
            ) {

                locationStatus.textContent =
                    'Location permission was denied. Allow location access to find your nearest health facility.';

            } else if (
                error.code ===
                error.POSITION_UNAVAILABLE
            ) {

                locationStatus.textContent =
                    'Your current location is unavailable. Please try again.';

            } else if (
                error.code ===
                error.TIMEOUT
            ) {

                locationStatus.textContent =
                    'Location request timed out. Please try again.';

            } else {

                locationStatus.textContent =
                    'Could not determine your location. Please try again.';
            }
        },

        {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 120000
        }
    );
}

// ==========================================================
// PREGNANCY CALCULATION
// ==========================================================

function parseLocalDate(dateString) {

    const parts =
        dateString.split('-').map(Number);

    if (parts.length !== 3) {
        return null;
    }

    return new Date(
        parts[0],
        parts[1] - 1,
        parts[2]
    );
}


function formatLocalDate(date) {

    const year =
        date.getFullYear();

    const month =
        String(date.getMonth() + 1)
            .padStart(2, '0');

    const day =
        String(date.getDate())
            .padStart(2, '0');

    return year + '-' + month + '-' + day;
}


function calculatePregnancyDetails(lastPeriodDate) {

    const lastPeriod =
        parseLocalDate(lastPeriodDate);

    if (!lastPeriod) {

        return {
            weeks: null,
            days: null,
            dueDate: null
        };
    }

    const today =
        new Date();

    /*
     * Strip the current time so that the calculation
     * is based on calendar days rather than hours.
     */
    const todayOnly =
        new Date(
            today.getFullYear(),
            today.getMonth(),
            today.getDate()
        );

    const difference =
        todayOnly.getTime() -
        lastPeriod.getTime();

    const days =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );

    const weeks =
        Math.floor(days / 7);

    /*
     * Standard estimated delivery:
     * 280 days / 40 weeks from LMP.
     */
    const dueDate =
        new Date(lastPeriod);

    dueDate.setDate(
        dueDate.getDate() + 280
    );

    return {
        weeks: weeks,
        days: days,
        dueDate: dueDate
    };
}


function updatePregnancyCalculation() {

    const lastPeriodInput =
        document.getElementById('lastPeriod');

    const dueDateInput =
        document.getElementById('expectedDelivery');

    const weeksInput =
        document.getElementById('weeksPregnant');

    if (!lastPeriodInput.value) {

        dueDateInput.value = '';
        weeksInput.value = '';

        updateProgress();

        return;
    }

    const details =
        calculatePregnancyDetails(
            lastPeriodInput.value
        );

    if (
        details.days === null ||
        details.days < 0
    ) {

        dueDateInput.value =
            details.dueDate
                ? formatLocalDate(details.dueDate)
                : '';

        weeksInput.value =
            'Invalid future date';

        updateProgress();

        return;
    }

    dueDateInput.value =
        formatLocalDate(details.dueDate);

    if (details.weeks <= 42) {

        const remainingDays =
            details.days % 7;

        weeksInput.value =
            details.weeks +
            ' weeks ' +
            remainingDays +
            ' days';

    } else {

        weeksInput.value =
            details.weeks +
            ' weeks - please consult your healthcare provider';
    }

    updateProgress();
}

    let filled = 0;
    let total = 0;
    
    inputs.forEach(input => {
        if (!input.hasAttribute('readonly')) {
            total++;
            if (input.value && input.value.trim() !== '') {
                filled++;
            }
        }
    });
    
    const percent = Math.round((filled / total) * 100);
    progressBar.style.width = percent + '%';
    progressPercent.textContent = percent + '%';
}

// Add event listeners
form.querySelectorAll('input, select').forEach(input => {
    if (!input.hasAttribute('readonly')) {
        input.addEventListener('input', updateProgress);
        input.addEventListener('change', updateProgress);
    }
});

loadUgandaDistricts();

// Load user data when page loads
loadUserData();

// Detect/update the nearest facility for the user's current location.
updateNearestHealthFacility();
</script>
