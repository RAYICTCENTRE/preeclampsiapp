<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

<title>Create Account - MotherCare</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #fff5e8;
    font-family: Arial, "Segoe UI", sans-serif;
    color: #334155;
    padding: 14px;
}

.container {
    width: 100%;
    max-width: 540px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

/* HEADER */

.header {
    text-align: center;
    padding: 32px 24px 20px;
}

.logo {
    color: #ed8214;
    font-size: 34px;
    font-weight: 800;
}

.subtitle {
    color: #c96f22;
    font-size: 15px;
    margin-top: 4px;
}

.title {
    margin-top: 32px;
    color: #17458f;
    font-size: 29px;
    font-weight: 700;
}

/* FORM */

.form {
    padding: 0 38px 30px;
}

.field {
    margin-bottom: 14px;
}

/* INPUTS */

input,
select {
    width: 100%;
    height: 54px;
    border: 2px solid #e1e7ef;
    border-radius: 16px;
    background: #fffdfa;
    padding: 0 17px;
    font-size: 16px;
    color: #1e293b;
    outline: none;
}

input:focus,
select:focus {
    border-color: #e67e22;
    box-shadow: 0 0 0 3px rgba(230,126,34,.10);
}

input::placeholder {
    color: #64748b;
    opacity: 1;
}

/* RED STAR */

.required-star {
    color: #dc2626;
    font-weight: 800;
}

/* PHONE */

.phone-group {
    display: grid;
    grid-template-columns: 42% 58%;
    gap: 8px;
}

.phone-help {
    color: #64748b;
    font-size: 11px;
    margin: 5px 4px 0;
}

/* PASSWORD */

.password-wrap {
    position: relative;
}

.password-wrap input {
    padding-right: 55px;
}

.toggle-password {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 19px;
    padding: 0;
}

.password-help {
    color: #64748b;
    font-size: 11px;
    margin: 5px 4px 0;
}

.password-help.valid {
    color: #15803d;
}

.password-help.invalid {
    color: #64748b;
}

/* PASSWORD MATCH */

.match-message {
    min-height: 15px;
    font-size: 11px;
    margin: 4px 4px 0;
}

.match {
    color: #15803d;
}

.no-match {
    color: #dc2626;
}

/* SERVER MESSAGE */

.message {
    display: none;
    padding: 11px 13px;
    border-radius: 12px;
    margin-bottom: 14px;
    font-size: 13px;
    line-height: 1.4;
}

.message.error {
    display: block;
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
}

.message.success {
    display: block;
    background: #f0fdf4;
    color: #15803d;
    border: 1px solid #bbf7d0;
}

/* BUTTON */

.submit-btn {
    width: 100%;
    height: 54px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #e67e22, #f39c12);
    color: white;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 7px;
}

.submit-btn:disabled {
    opacity: .65;
    cursor: not-allowed;
}

/* LOGIN */

.login-link {
    text-align: center;
    margin-top: 17px;
    font-size: 14px;
}

.login-link a {
    color: #17458f;
    font-weight: 700;
    text-decoration: none;
}

/* MOBILE */

@media (max-width: 480px) {

    body {
        padding: 0;
    }

    .container {
        min-height: 100vh;
        border-radius: 0;
    }

    .header {
        padding-top: 28px;
    }

    .form {
        padding: 0 22px 25px;
    }

    .logo {
        font-size: 31px;
    }

    .title {
        font-size: 27px;
        margin-top: 28px;
    }

    .phone-group {
        grid-template-columns: 42% 58%;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            MotherCare
        </div>

        <div class="subtitle">
            Pre-eclampsia Guardian
        </div>

        <div class="title">
            Create Account
        </div>

    </div>


    <!-- FORM -->

    <form id="signupForm" class="form" novalidate>

        <div id="message" class="message"></div>


        <!-- FIRST NAME -->

        <div class="field">

            <input
                type="text"
                id="firstname"
                name="firstname"
                placeholder="First Name *"
                autocomplete="given-name"
                maxlength="50"
                required
            >

        </div>


        <!-- LAST NAME -->

        <div class="field">

            <input
                type="text"
                id="lastname"
                name="lastname"
                placeholder="Last Name *"
                autocomplete="family-name"
                maxlength="50"
                required
            >

        </div>


        <!-- EMAIL -->

        <div class="field">

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Email Address (optional)"
                autocomplete="email"
                maxlength="120"
            >

        </div>


        <!-- PHONE -->

        <div class="field">

            <div class="phone-group">

                <select
                    id="country_code"
                    name="country_code"
                    required
                >

                    <option value="+256" selected>
                        🇺🇬 +256
                    </option>

                    <option value="+254">
                        🇰🇪 +254
                    </option>

                    <option value="+255">
                        🇹🇿 +255
                    </option>

                    <option value="+211">
                        🇸🇸 +211
                    </option>

                    <option value="+250">
                        🇷🇼 +250
                    </option>

                    <option value="+243">
                        🇨🇩 +243
                    </option>

                    <option value="+234">
                        🇳🇬 +234
                    </option>

                    <option value="+251">
                        🇪🇹 +251
                    </option>

                    <option value="+27">
                        🇿🇦 +27
                    </option>

                    <option value="+44">
                        🇬🇧 +44
                    </option>

                    <option value="+1">
                        🇺🇸 +1
                    </option>

                </select>


                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Phone Number *"
                    inputmode="numeric"
                    autocomplete="tel"
                    maxlength="20"
                    required
                >

            </div>

            <div class="phone-help">
                Example: 0772 123456
            </div>

        </div>


        <!-- ACCOUNT TYPE -->

        <div class="field">

            <select
                id="user_type"
                name="user_type"
                required
            >

                <option value="">
                    Select User Type *
                </option>

                <option value="client">
                    Client / Mother
                </option>

                <option value="doctor">
                    Healthcare Provider / Doctor
                </option>

            </select>

        </div>


        <!-- PASSWORD -->

        <div class="field">

            <div class="password-wrap">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create Password *"
                    autocomplete="new-password"
                    maxlength="128"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-target="password"
                    aria-label="Show password"
                >
                    👁
                </button>

            </div>

            <div
                id="passwordHelp"
                class="password-help"
            >
                Min. 8 characters: uppercase, lowercase, number & symbol
            </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="field">

            <div class="password-wrap">

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm Password *"
                    autocomplete="new-password"
                    maxlength="128"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-target="confirm_password"
                    aria-label="Show password"
                >
                    👁
                </button>

            </div>

            <div
                id="passwordMatch"
                class="match-message"
            ></div>

        </div>


        <!-- SUBMIT -->

        <button
            type="submit"
            id="submitBtn"
            class="submit-btn"
        >
            Create Account
        </button>


        <!-- LOGIN -->

        <div class="login-link">

            Already have an account?

            <a href="screen2.html">
                Login
            </a>

        </div>

    </form>

</div>


<script>

"use strict";


/* =========================================================
   ELEMENTS
   ========================================================= */

const form =
    document.getElementById("signupForm");

const password =
    document.getElementById("password");

const confirmPassword =
    document.getElementById("confirm_password");

const submitBtn =
    document.getElementById("submitBtn");

const messageBox =
    document.getElementById("message");

const passwordHelp =
    document.getElementById("passwordHelp");

const passwordMatch =
    document.getElementById("passwordMatch");


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(
    message,
    type = "error"
) {

    messageBox.textContent =
        message;

    messageBox.className =
        "message " + type;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


function clearMessage() {

    messageBox.textContent = "";

    messageBox.className =
        "message";
}


/* =========================================================
   PASSWORD VALIDATION
   ========================================================= */

function validatePassword(value) {

    const valid =
        value.length >= 8 &&
        /[A-Z]/.test(value) &&
        /[a-z]/.test(value) &&
        /[0-9]/.test(value) &&
        /[^A-Za-z0-9]/.test(value);


    if (value.length === 0) {

        passwordHelp.textContent =
            "Min. 8 characters: uppercase, lowercase, number & symbol";

        passwordHelp.className =
            "password-help";

        return false;
    }


    if (valid) {

        passwordHelp.textContent =
            "✓ Strong password";

        passwordHelp.className =
            "password-help valid";

    } else {

        passwordHelp.textContent =
            "Min. 8 characters: uppercase, lowercase, number & symbol";

        passwordHelp.className =
            "password-help invalid";
    }


    return valid;
}


/* =========================================================
   PASSWORD MATCH
   ========================================================= */

function checkPasswordMatch() {

    if (confirmPassword.value === "") {

        passwordMatch.textContent = "";

        passwordMatch.className =
            "match-message";

        return false;
    }


    if (
        password.value ===
        confirmPassword.value
    ) {

        passwordMatch.textContent =
            "✓ Passwords match";

        passwordMatch.className =
            "match-message match";

        return true;

    } else {

        passwordMatch.textContent =
            "✗ Passwords do not match";

        passwordMatch.className =
            "match-message no-match";

        return false;
    }
}


password.addEventListener(
    "input",
    function() {

        validatePassword(
            password.value
        );

        checkPasswordMatch();

    }
);


confirmPassword.addEventListener(
    "input",
    checkPasswordMatch
);


/* =========================================================
   SHOW / HIDE PASSWORD
   ========================================================= */

document
    .querySelectorAll(".toggle-password")
    .forEach(button => {

        button.addEventListener(
            "click",
            function() {

                const field =
                    document.getElementById(
                        this.dataset.target
                    );


                if (
                    field.type ===
                    "password"
                ) {

                    field.type =
                        "text";

                    this.textContent =
                        "🙈";

                    this.setAttribute(
                        "aria-label",
                        "Hide password"
                    );

                } else {

                    field.type =
                        "password";

                    this.textContent =
                        "👁";

                    this.setAttribute(
                        "aria-label",
                        "Show password"
                    );
                }

            }
        );

    });


/* =========================================================
   PHONE NORMALIZATION
   ========================================================= */

function normalizePhone(
    countryCode,
    rawPhone
) {

    let digits =
        rawPhone.replace(
            /\D/g,
            ""
        );


    if (!digits) {
        return "";
    }


    const countryDigits =
        countryCode.replace(
            /\D/g,
            ""
        );


    /*
     * If user enters country code,
     * remove it first.
     */

    if (
        digits.startsWith(
            countryDigits
        )
    ) {

        digits =
            digits.substring(
                countryDigits.length
            );
    }


    /*
     * Remove leading zero.
     */

    digits =
        digits.replace(
            /^0+/,
            ""
        );


    return countryCode + digits;
}


/* =========================================================
   SUBMIT FORM
   ========================================================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        clearMessage();


        const firstname =
            document
                .getElementById("firstname")
                .value
                .trim();


        const lastname =
            document
                .getElementById("lastname")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const countryCode =
            document
                .getElementById("country_code")
                .value;


        const rawPhone =
            document
                .getElementById("phone")
                .value
                .trim();


        const userType =
            document
                .getElementById("user_type")
                .value;


        const passwordValue =
            password.value;


        const confirmValue =
            confirmPassword.value;


        /* FIRST NAME */

        if (!firstname) {

            showMessage(
                "Please enter your first name."
            );

            return;
        }


        /* LAST NAME */

        if (!lastname) {

            showMessage(
                "Please enter your last name."
            );

            return;
        }


        /* PHONE */

        if (!rawPhone) {

            showMessage(
                "Phone number is required."
            );

            return;
        }


        const normalizedPhone =
            normalizePhone(
                countryCode,
                rawPhone
            );


        if (
            !normalizedPhone ||
            normalizedPhone.length <
            countryCode.length + 7
        ) {

            showMessage(
                "Please enter a valid phone number."
            );

            return;
        }


        /* ACCOUNT TYPE */

        if (!userType) {

            showMessage(
                "Please select your account type."
            );

            return;
        }


        /* PASSWORD */

        if (
            !validatePassword(
                passwordValue
            )
        ) {

            showMessage(
                "Password must contain at least 8 characters, uppercase, lowercase, number and symbol."
            );

            password.focus();

            return;
        }


        /* CONFIRM PASSWORD */

        if (
            !checkPasswordMatch()
        ) {

            showMessage(
                "Passwords do not match."
            );

            confirmPassword.focus();

            return;
        }


        /* EMAIL IS OPTIONAL */

        if (
            email &&
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
                .test(email)
        ) {

            showMessage(
                "Please enter a valid email address or leave it blank."
            );

            return;
        }


        /* FORM DATA */

        const formData =
            new FormData();


        formData.append(
            "firstname",
            firstname
        );

        formData.append(
            "lastname",
            lastname
        );

        formData.append(
            "email",
            email
        );

        formData.append(
            "phone",
            normalizedPhone
        );

        formData.append(
            "user_type",
            userType
        );

        formData.append(
            "password",
            passwordValue
        );

        formData.append(
            "confirm_password",
            confirmValue
        );


        /* SUBMITTING */

        submitBtn.disabled =
            true;

        submitBtn.textContent =
            "Creating Account...";


        try {

            const response =
                await fetch(
                    "signup.php",
                    {
                        method: "POST",
                        body: formData,
                        credentials: "same-origin"
                    }
                );


            const data =
                await response.json();


            if (data.success) {

                showMessage(
                    data.message ||
                    "Account created successfully.",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            data.redirect ||
                            "screen2.html";

                    },
                    1200
                );


            } else {

                showMessage(
                    data.message ||
                    "Registration failed. Please try again."
                );

            }


        } catch (error) {

            console.error(
                "Registration error:",
                error
            );


            showMessage(
                "Unable to connect to the server. Please check your connection and try again."
            );


        } finally {

            submitBtn.disabled =
                false;

            submitBtn.textContent =
                "Create Account";

        }

    }
);

</script>

</body>
</html>
