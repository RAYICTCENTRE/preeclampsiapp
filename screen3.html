<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign Up - MotherCare</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #fff5e8 0%, #ffe8d4 100%);
    font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.signup-container {
    max-width: 450px;
    width: 100%;
    background: white;
    border-radius: 32px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    padding: 40px 32px;
    animation: fadeInUp 0.5s ease;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo {
    text-align: center;
    margin-bottom: 28px;
}

.logo h1 {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, #e67e22 0%, #f39c12 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.logo p {
    font-size: 13px;
    color: #b86f2c;
    margin-top: 4px;
}

h2 {
    text-align: center;
    color: #1e3a8a;
    font-size: 24px;
    margin-bottom: 24px;
}

.form-group {
    margin-bottom: 16px;
}

input, select {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e2e8f0;
    border-radius: 14px;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.3s ease;
    background: #fefcf8;
}

input:focus, select:focus {
    outline: none;
    border-color: #e67e22;
    box-shadow: 0 0 0 3px rgba(230,126,34,0.1);
    background: white;
}

/* PHONE NUMBER AREA */
.phone-row {
    display: flex;
    gap: 8px;
    width: 100%;
}

.country-code {
    width: 42%;
    flex-shrink: 0;
}

.phone-input {
    width: 58%;
}

.phone-note {
    font-size: 11px;
    color: #64748b;
    margin-top: 6px;
    padding-left: 4px;
}

.optional-note {
    font-size: 11px;
    color: #64748b;
    margin-top: 5px;
    padding-left: 4px;
}

.required-note {
    font-size: 11px;
    color: #dc2626;
    margin-top: 5px;
    padding-left: 4px;
}

.btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 8px;
}

.btn-primary {
    background: linear-gradient(135deg, #e67e22 0%, #f39c12 100%);
    color: white;
    box-shadow: 0 4px 12px rgba(230,126,34,0.3);
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(230,126,34,0.4);
}

.btn-secondary {
    background: #f1f5f9;
    color: #64748b;
}

.btn-secondary:hover {
    background: #e2e8f0;
    transform: translateY(-2px);
}

.message {
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    margin-top: 12px;
    font-size: 13px;
    display: none;
}

.message.error {
    background: #fee2e2;
    color: #dc2626;
    display: block;
}

.message.success {
    background: #dcfce7;
    color: #16a34a;
    display: block;
}

.divider {
    text-align: center;
    margin: 20px 0;
    position: relative;
}

.divider::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
    background: #e2e8f0;
}

.divider span {
    background: white;
    padding: 0 12px;
    position: relative;
    z-index: 1;
    color: #94a3b8;
    font-size: 12px;
}

@media (max-width: 480px) {
    .signup-container {
        padding: 28px 24px;
    }
    
    h2 {
        font-size: 22px;
    }

    .country-code {
        width: 43%;
    }

    .phone-input {
        width: 57%;
    }
}
</style>
</head>

<body>

<div class="signup-container">

    <!-- LOGO -->
    <div class="logo">
        <h1>MotherCare</h1>
        <p>Pre-eclampsia Guardian</p>
    </div>
    
    <h2>Create Account</h2>
    
    <form id="signupForm">

        <!-- FIRST NAME -->
        <div class="form-group">
            <input
                type="text"
                name="firstname"
                placeholder="First Name"
                required
            >
        </div>
        
        <!-- LAST NAME -->
        <div class="form-group">
            <input
                type="text"
                name="lastname"
                placeholder="Last Name"
                required
            >
        </div>
        
        <!-- EMAIL - OPTIONAL -->
        <div class="form-group">
            <input
                type="email"
                name="email"
                id="email"
                placeholder="Email Address (optional)"
            >

            <div class="optional-note">
                Email is optional. You can also use your phone number to login.
            </div>
        </div>
        
        <!-- PHONE NUMBER - REQUIRED -->
        <div class="form-group">

            <div class="phone-row">

                <!-- COUNTRY CODE -->
                <select
                    name="country_code"
                    id="country_code"
                    class="country-code"
                    required
                >
                    <option value="+256" selected>
                        🇺🇬 Uganda (+256)
                    </option>

                    <option value="+254">
                        🇰🇪 Kenya (+254)
                    </option>

                    <option value="+255">
                        🇹🇿 Tanzania (+255)
                    </option>

                    <option value="+250">
                        🇷🇼 Rwanda (+250)
                    </option>

                    <option value="+211">
                        🇸🇸 South Sudan (+211)
                    </option>

                    <option value="+243">
                        🇨🇩 DR Congo (+243)
                    </option>

                    <option value="+234">
                        🇳🇬 Nigeria (+234)
                    </option>

                    <option value="+233">
                        🇬🇭 Ghana (+233)
                    </option>

                    <option value="+27">
                        🇿🇦 South Africa (+27)
                    </option>

                    <option value="+1">
                        🇺🇸 USA (+1)
                    </option>

                    <option value="+44">
                        🇬🇧 UK (+44)
                    </option>

                    <option value="+91">
                        🇮🇳 India (+91)
                    </option>

                    <option value="+971">
                        🇦🇪 UAE (+971)
                    </option>
                </select>

                <!-- PHONE NUMBER -->
                <input
                    type="tel"
                    name="phone"
                    id="phone"
                    class="phone-input"
                    placeholder="Phone Number"
                    inputmode="numeric"
                    autocomplete="tel"
                    required
                >

            </div>

            <div class="required-note">
                Phone number is required
            </div>

            <div class="phone-note">
                Example: 0772 123456 → +256772123456
            </div>

        </div>
        
        <!-- USER TYPE -->
        <div class="form-group">
            <select name="user_type" required>
                <option value="">Select User Type</option>

                <option value="client">
                    Patient
                </option>

                <option value="doctor">
                    Doctor
                </option>
            </select>
        </div>
        
        <!-- PASSWORD -->
        <div class="form-group">
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create Password (min 6 characters)"
                required
            >
        </div>
        
        <!-- CONFIRM PASSWORD -->
        <div class="form-group">
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm Password"
                required
            >
        </div>
        
        <!-- SIGN UP BUTTON -->
        <button
            type="submit"
            class="btn btn-primary"
        >
            Sign Up
        </button>

    </form>
    
    <!-- DIVIDER -->
    <div class="divider">
        <span>OR</span>
    </div>
    
    <!-- LOGIN BUTTON -->
    <button
        class="btn btn-secondary"
        onclick="window.location.href='screen2.html'"
    >
        Already have an account? Login
    </button>
    
    <!-- MESSAGE -->
    <div id="message" class="message"></div>

</div>

<script>

document.getElementById('signupForm').addEventListener('submit', async function(e) {

    e.preventDefault();

    const password =
        document.getElementById('password').value;

    const confirmPassword =
        document.getElementById('confirm_password').value;

    const phoneInput =
        document.getElementById('phone');

    const countryCode =
        document.getElementById('country_code').value;

    const emailInput =
        document.getElementById('email');

    const messageDiv =
        document.getElementById('message');


    /* =========================================
       CLEAR PREVIOUS MESSAGE
    ========================================= */

    messageDiv.className = "message";
    messageDiv.innerText = "";


    /* =========================================
       VALIDATE PASSWORDS
    ========================================= */

    if (password !== confirmPassword) {

        messageDiv.className = "message error";

        messageDiv.innerText =
            "❌ Passwords do not match!";

        return;
    }


    /* =========================================
       VALIDATE PASSWORD LENGTH
    ========================================= */

    if (password.length < 6) {

        messageDiv.className = "message error";

        messageDiv.innerText =
            "❌ Password must be at least 6 characters";

        return;
    }


    /* =========================================
       GET PHONE NUMBER
    ========================================= */

    let phone =
        phoneInput.value.trim();


    /* =========================================
       PHONE REQUIRED
    ========================================= */

    if (!phone) {

        messageDiv.className = "message error";

        messageDiv.innerText =
            "❌ Phone number is required";

        phoneInput.focus();

        return;
    }


    /* =========================================
       REMOVE EVERYTHING EXCEPT NUMBERS
       
       Example:
       0772 123-456
       becomes:
       0772123456
    ========================================= */

    phone = phone.replace(/\D/g, "");


    /* =========================================
       REMOVE ALL LEADING ZEROS
       
       Example:
       0772123456
       becomes:
       772123456
       
       00772123456
       also becomes:
       772123456
    ========================================= */

    phone = phone.replace(/^0+/, "");


    /* =========================================
       CHECK PHONE AFTER CLEANING
    ========================================= */

    if (!phone || phone.length < 7) {

        messageDiv.className = "message error";

        messageDiv.innerText =
            "❌ Please enter a valid phone number";

        phoneInput.focus();

        return;
    }


    /* =========================================
       CREATE INTERNATIONAL PHONE NUMBER
       
       Example:
       
       Country code = +256
       Number = 772123456
       
       Result:
       +256772123456
    ========================================= */

    const fullPhone =
        countryCode + phone;


    /* =========================================
       PUT NORMALIZED NUMBER BACK INTO FORM
       
       This ensures signup.php receives:
       
       +256772123456
       
       instead of:
       
       0772123456
    ========================================= */

    phoneInput.value = fullPhone;


    /* =========================================
       GET FORM DATA
    ========================================= */

    const formData =
        new FormData(this);


    /* =========================================
       EMAIL IS OPTIONAL
       
       If empty, send an empty value.
    ========================================= */

    if (emailInput.value.trim() === "") {

        formData.set("email", "");

    } else {

        formData.set(
            "email",
            emailInput.value.trim()
        );

    }


    /* =========================================
       SEND NORMALIZED PHONE
    ========================================= */

    formData.set(
        "phone",
        fullPhone
    );


    /* =========================================
       SUBMIT TO PHP
    ========================================= */

    try {

        const response = await fetch(
            'signup.php',
            {
                method: 'POST',
                body: formData
            }
        );


        /* =====================================
           READ JSON RESPONSE
        ===================================== */

        const result =
            await response.json();


        /* =====================================
           SUCCESS
        ===================================== */

        if (result.success) {

            messageDiv.className =
                "message success";

            messageDiv.innerText =
                "✅ " + result.message;


            /* =================================
               REDIRECT AFTER SUCCESS
            ================================= */

            setTimeout(() => {

                window.location.href =
                    result.redirect;

            }, 1500);

        }


        /* =====================================
           ERROR FROM PHP
        ===================================== */

        else {

            messageDiv.className =
                "message error";

            messageDiv.innerText =
                "❌ " + result.message;

        }

    }


    /* =========================================
       NETWORK / SERVER ERROR
    ========================================= */

    catch (error) {

        console.error(
            "Signup error:",
            error
        );

        messageDiv.className =
            "message error";

        messageDiv.innerText =
            "❌ Network error. Please try again.";

    }

});

</script>

</body>
</html>
