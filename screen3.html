<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign Up - MotherCare</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #fff5e8 0%, #ffe8d4 100%);
    font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.signup-container {
    max-width: 450px;
    width: 100%;
    background: white;
    border-radius: 32px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    padding: 40px 32px;
    animation: fadeInUp 0.5s ease;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo {
    text-align: center;
    margin-bottom: 28px;
}

.logo h1 {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, #e67e22 0%, #f39c12 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.logo p {
    font-size: 13px;
    color: #b86f2c;
    margin-top: 4px;
}

h2 {
    text-align: center;
    color: #1e3a8a;
    font-size: 24px;
    margin-bottom: 24px;
}

.form-group {
    margin-bottom: 16px;
}

input,
select {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e2e8f0;
    border-radius: 14px;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.3s ease;
    background: #fefcf8;
}

input:focus,
select:focus {
    outline: none;
    border-color: #e67e22;
    box-shadow: 0 0 0 3px rgba(230,126,34,0.1);
    background: white;
}

.phone-row {
    display: flex;
    gap: 8px;
}

.country-code {
    width: 42%;
    flex-shrink: 0;
}

.phone-number {
    width: 58%;
}

.phone-hint {
    font-size: 11px;
    color: #64748b;
    margin-top: 6px;
    padding-left: 4px;
}

.required-label {
    font-size: 11px;
    color: #dc2626;
    margin-top: 5px;
    padding-left: 4px;
}

.optional-label {
    font-size: 11px;
    color: #64748b;
    margin-top: 5px;
    padding-left: 4px;
}

.btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 8px;
}

.btn-primary {
    background: linear-gradient(135deg, #e67e22 0%, #f39c12 100%);
    color: white;
    box-shadow: 0 4px 12px rgba(230,126,34,0.3);
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(230,126,34,0.4);
}

.btn-secondary {
    background: #f1f5f9;
    color: #64748b;
}

.btn-secondary:hover {
    background: #e2e8f0;
    transform: translateY(-2px);
}

.message {
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    margin-top: 12px;
    font-size: 13px;
    display: none;
}

.message.error {
    background: #fee2e2;
    color: #dc2626;
    display: block;
}

.message.success {
    background: #dcfce7;
    color: #16a34a;
    display: block;
}

.divider {
    text-align: center;
    margin: 20px 0;
    position: relative;
}

.divider::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
    background: #e2e8f0;
}

.divider span {
    background: white;
    padding: 0 12px;
    position: relative;
    z-index: 1;
    color: #94a3b8;
    font-size: 12px;
}

@media (max-width: 480px) {
    .signup-container {
        padding: 28px 24px;
    }

    h2 {
        font-size: 22px;
    }

    .country-code {
        width: 44%;
    }

    .phone-number {
        width: 56%;
    }
}
</style>
</head>

<body>

<div class="signup-container">

    <div class="logo">
        <h1>MotherCare</h1>
        <p>Pre-eclampsia Guardian</p>
    </div>

    <h2>Create Account</h2>

    <form id="signupForm">

        <!-- FIRST NAME -->
        <div class="form-group">
            <input
                type="text"
                name="firstname"
                placeholder="First Name"
                required
            >
        </div>

        <!-- LAST NAME -->
        <div class="form-group">
            <input
                type="text"
                name="lastname"
                placeholder="Last Name"
                required
            >
        </div>

        <!-- EMAIL OPTIONAL -->
        <div class="form-group">
            <input
                type="email"
                name="email"
                id="email"
                placeholder="Email Address (optional)"
            >
            <div class="optional-label">
                Email is optional. You can also log in using your phone number.
            </div>
        </div>

        <!-- PHONE
