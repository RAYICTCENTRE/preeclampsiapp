<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MotherCare - Pre-eclampsia Guardian</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* Android-style landing screen */
        .container {
            position: relative;
            width: 360px;
            height: 640px;
            margin: 0 auto;
            border-radius: 24px;

            /* Keep containerbackground.png beside screen1.html */
            background-image: url('containerbackground.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            border: 3px solid #dce8f7;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        /* MotherCare remains an HTML image */
        .logo {
            position: absolute;
            top: 42px;
            left: 50%;
            transform: translateX(-50%);
            display: block;
            width: 200px;
            height: auto;
            z-index: 10;
            animation: blink 2s linear infinite;
        }

        @keyframes blink {
            0%   { opacity: 1; }
            50%  { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /*
         * IMPORTANT:
         * "Pre-eclampsia Guardian" and
         * "Monitor your well-being during pregnancy."
         * are intentionally NOT in the HTML.
         *
         * They are already printed into containerbackground.png.
         */

        /*
         * Real HTML buttons.
         *
         * The background has a large empty white panel below the blue wave.
         * These coordinates place the buttons inside that panel.
         */
        .login-container {
            position: absolute;
            left: 24px;
            right: 24px;
            top: 492px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0;
            margin: 0;
            z-index: 20;
        }

        .btn-login,
        .btn-signup {
            width: 100%;
            height: 44px;
            padding: 0;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        .btn-login {
            background-color: white;
            color: #ff8c42;
            border: 2px solid #ff8c42;
        }

        .btn-login:hover {
            background-color: #e67e22;
            color: white;
        }

        .btn-signup {
            background-color: #ff8c42;
            color: white;
            border: 2px solid #ff8c42;
        }

        .btn-signup:hover {
            background-color: #e67e22;
        }

        .btn-login:active,
        .btn-signup:active {
            transform: scale(0.97);
        }

        /* AI caption remains controlled by HTML */
        .notice {
            position: absolute;
            left: 20px;
            right: 20px;
            top: 604px;
            margin: 0;
            padding: 0;
            text-align: center;
            font-size: 11px;
            color: #1e3a8a;
            font-weight: bold;
            z-index: 20;
        }

        /* Keep the layout proportional on smaller Android screens */
        @media (max-width: 380px) {
            body {
                padding: 8px;
            }

            .container {
                width: min(360px, calc(100vw - 16px));
                height: calc(min(360px, calc(100vw - 16px)) * 1.7777778);
            }

            .logo {
                top: 6.56%;
                width: 55.56%;
            }

            .login-container {
                top: 76.875%;
                left: 6.67%;
                right: 6.67%;
            }

            .notice {
                top: 94.375%;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- Existing MotherCare logo -->
        <img
            src="logo.png"
            class="logo"
            alt="MotherCare Logo"
            onerror="this.src='https://placehold.co/140x60/ff8c42/white?text=MotherCare'"
        >

        <!--
            These two texts are intentionally removed from HTML because
            they are part of containerbackground.png:

            Pre-eclampsia Guardian
            Monitor your well-being during pregnancy.
        -->

        <!-- Real interactive HTML buttons -->
        <div class="login-container">
            <button
                class="btn-login"
                onclick="location.href='screen2.html'">
                <b>LOGIN</b>
            </button>

            <button
                class="btn-signup"
                onclick="location.href='screen3.html'">
                <b>SIGN UP</b>
            </button>
        </div>

        <!-- Kept in HTML, as requested -->
        <div class="notice">
            Predicting Preeclampsia Risk Using AI
        </div>

    </div>

    <script>
        console.log(
            "Page loaded - Login goes to screen2.html, Signup goes to screen3.html"
        );
    </script>
</body>
</html>
