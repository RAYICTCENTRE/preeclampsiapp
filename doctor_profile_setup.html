<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Doctor Profile - MotherCare</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    background:linear-gradient(135deg,#fff5e8 0%,#ffe8d4 100%);
    font-family:'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    padding:30px 15px;
}

.profile-container{
    max-width:600px;width:100%;margin:auto;background:#fff;
    border-radius:28px;box-shadow:0 20px 40px rgba(0,0,0,.08);
    overflow:hidden;
}

.header{
    background:linear-gradient(135deg,#e67e22 0%,#f39c12 100%);
    padding:28px 25px;text-align:center;color:#fff;
}
.header h1{font-size:27px;margin-bottom:7px}
.header p{font-size:14px;opacity:.92}

.form-content{padding:30px}

.form-group{margin-bottom:22px}
.form-group label{
    display:block;font-weight:600;color:#334155;
    margin-bottom:8px;font-size:14px;
}
.required{color:#e74c3c;margin-left:3px}

input[type="text"],select,textarea{
    width:100%;padding:13px 15px;border:2px solid #e2e8f0;
    border-radius:12px;font-size:14px;font-family:inherit;
    background:#fefcf8;transition:.25s;
}
input:focus,select:focus,textarea:focus{
    outline:none;border-color:#e67e22;
    box-shadow:0 0 0 3px rgba(230,126,34,.1);
    background:#fff;
}
textarea{resize:vertical;min-height:105px}

/* PHOTO AREA */
.photo-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.photo-option{
    border:2px solid #e2e8f0;
    appearance:none;
    -webkit-appearance:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    font-family:inherit;
    color:inherit;
    background:#fffaf5;
    border-radius:15px;
    padding:18px 10px;
    text-align:center;
    cursor:pointer;
    transition:.25s;
}
.photo-option:hover{
    border-color:#e67e22;
    background:#fff5e8;
    transform:translateY(-2px);
}
.photo-option .icon{font-size:30px;margin-bottom:8px}
.photo-option strong{display:block;color:#334155;font-size:14px}
.photo-option span{display:block;color:#94a3b8;font-size:11px;margin-top:4px}

.photo-preview{
    display:none;text-align:center;margin-top:18px;
}
.photo-preview.show{display:block}
.photo-preview img{
    width:130px;height:130px;border-radius:50%;
    object-fit:cover;border:4px solid #e67e22;
    box-shadow:0 6px 18px rgba(230,126,34,.2);
}
.selected-file{
    margin-top:8px;color:#64748b;font-size:12px;
    word-break:break-word;
}
.remove-photo{
    margin-top:9px;border:0;background:none;color:#dc2626;
    font-size:13px;font-weight:600;cursor:pointer;
}

/* MESSAGES */
.message{
    padding:12px;border-radius:10px;margin-bottom:18px;
    font-size:14px;display:none;
}
.message.success{display:block;background:#dcfce7;color:#15803d}
.message.error{display:block;background:#fee2e2;color:#b91c1c}
.message.loading{display:block;background:#fff7ed;color:#c2410c}

/* BUTTONS */
.button-group{
    display:flex;flex-direction:row;gap:12px;margin-top:28px;
}
.btn{
    flex:1;border:0;border-radius:12px;padding:14px 18px;
    font-size:15px;font-weight:700;font-family:inherit;
    cursor:pointer;transition:.25s;
}
.btn-cancel{
    background:#dc3545;color:#fff;
    box-shadow:0 4px 12px rgba(220,53,69,.22);
}
.btn-cancel:hover{background:#bb2d3b;transform:translateY(-2px)}
.btn-save{
    background:linear-gradient(135deg,#e67e22,#f39c12);
    color:#fff;box-shadow:0 4px 12px rgba(230,126,34,.28);
}
.btn-save:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.65;cursor:not-allowed;transform:none}

@media(max-width:520px){
    body{padding:15px 10px}
    .profile-container{border-radius:22px}
    .header{padding:24px 18px}
    .header h1{font-size:23px}
    .form-content{padding:22px 17px}
    .photo-options{gap:8px}
    .photo-option{padding:15px 7px}
    .button-group{gap:9px}
    .btn{padding:14px 8px;font-size:13px}
}
</style>
</head>

<body>

<div class="profile-container">

    <div class="header">
        <h1>Doctor Profile</h1>
        <p>Complete your professional details</p>
    </div>

    <div class="form-content">

        <div id="message" class="message"></div>

        <form id="profileForm"
              action="doctor_profile_setup.php"
              method="POST"
              enctype="multipart/form-data">

            <!-- PHOTO -->
            <div class="form-group">
                <label>
                    Profile Photo <span style="color:#94a3b8;font-weight:400;">(Optional)</span>
                </label>

                <div class="photo-options">

                    <!-- CAMERA -->
                    <button type="button" class="photo-option" onclick="openCamera()" aria-label="Take profile photo with camera">
                        <div class="icon">📷</div>
                        <strong>Take Selfie</strong>
                        <span>Open camera</span>
                    </button>

                    <!-- STORAGE -->
                    <button type="button" class="photo-option" onclick="openStorage()" aria-label="Choose profile photo from device">
                        <div class="icon">📎</div>
                        <strong>Upload Photo</strong>
                        <span>Gallery / Files (optional)</span>
                    </button>

                </div>

                <!--
     Separate native file inputs.
     Camera input uses capture where supported, but the JS also
     works on browsers that ignore capture.
-->
<input
    type="file"
    id="cameraInput"
    name="camera_photo"
    accept="image/*"
    capture="user"
    style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;"
>

<input
    type="file"
    id="storageInput"
    name="storage_photo"
    accept="image/*"
    style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;"
>

                <div id="photoPreview" class="photo-preview">
                    <img id="previewImage" src="" alt="Profile photo preview">
                    <div id="selectedFile" class="selected-file"></div>
                    <button type="button" class="remove-photo" onclick="removePhoto()">
                        Remove selected photo
                    </button>
                </div>
            </div>

            <!-- SPECIALTY -->
            <div class="form-group">
                <label>
                    Specialty Focus <span class="required">*</span>
                </label>

                <select name="specialty" required>
                    <option value="">Select your specialty</option>
                    <option value="Obstetrician">Obstetrician</option>
                    <option value="Gynecologist">Gynecologist</option>
                    <option value="General Practitioner">General Practitioner</option>
                    <option value="Midwife">Midwife</option>
                    <option value="Maternal Health Specialist">Maternal Health Specialist</option>
                </select>
            </div>

            <!-- FACILITY -->
            <div class="form-group">
                <label>
                    Medical Facility / Hospital <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="facility"
                    placeholder="e.g., Mulago Hospital"
                    required
                >
            </div>

            <!-- QUALIFICATIONS -->
            <div class="form-group">
                <label>
                    Qualifications & Background <span class="required">*</span>
                </label>

                <textarea
                    name="qualifications"
                    placeholder="e.g., MBChB, MMed in Obstetrics and Gynecology"
                    required
                ></textarea>
            </div>

            <!-- BUTTONS -->
            <div class="button-group">
                <button
                    type="button"
                    class="btn btn-cancel"
                    onclick="cancelProfile()">
                    ✕ Cancel
                </button>

                <button
                    type="submit"
                    id="saveBtn"
                    class="btn btn-save">
                    ✓ Save Profile
                </button>
            </div>

        </form>
    </div>
</div>

<script>
const form = document.getElementById('profileForm');
const cameraInput = document.getElementById('cameraInput');
const storageInput = document.getElementById('storageInput');
const photoPreview = document.getElementById('photoPreview');
const previewImage = document.getElementById('previewImage');
const selectedFile = document.getElementById('selectedFile');
const message = document.getElementById('message');
const saveBtn = document.getElementById('saveBtn');

let selectedPhoto = null;

function openCamera(){

    clearMessage();

    /*
     * On Android Chrome, Samsung Internet and many mobile
     * browsers, capture="user" opens the front camera.
     *
     * On browsers that do not support capture, the same
     * input falls back to the device's normal image picker.
     */
    try {
        cameraInput.removeAttribute('disabled');
        cameraInput.click();
    } catch(error) {
        console.error('Camera picker error:', error);
        showMessage(
            'Your browser could not open the camera. Please use Upload Photo instead.',
            'error'
        );
    }
}

function openStorage(){

    clearMessage();

    try {
        storageInput.removeAttribute('disabled');
        storageInput.click();
    } catch(error) {
        console.error('Storage picker error:', error);
        showMessage(
            'Your browser could not open the file picker. Please check browser permissions.',
            'error'
        );
    }
}

cameraInput.addEventListener('change', function(){

    if(this.files && this.files.length){
        handlePhoto(this.files[0]);
    }

});

storageInput.addEventListener('change', function(){

    if(this.files && this.files.length){
        handlePhoto(this.files[0]);
    }

});

function handlePhoto(file){

    if(!file){
        return;
    }

    /*
     * Some mobile browsers may return an empty MIME type.
     * Therefore, validate the extension as a fallback.
     */
    const allowedTypes = [
        'image/jpeg',
        'image/jpg',
        'image/png',
        'image/webp',
        'image/heic',
        'image/heif'
    ];

    const fileName =
        (file.name || '').toLowerCase();

    const allowedExtensions = [
        '.jpg',
        '.jpeg',
        '.png',
        '.webp',
        '.heic',
        '.heif'
    ];

    const validType =
        !file.type ||
        allowedTypes.includes(file.type);

    const validExtension =
        allowedExtensions.some(
            ext => fileName.endsWith(ext)
        );

    if(!validType && !validExtension){

        showMessage(
            'Please select a photo in JPG, PNG, WebP or another supported phone image format.',
            'error'
        );

        clearSelectedPhoto();
        return;
    }

    /*
     * 5MB frontend limit.
     * PHP should enforce its own limit too.
     */
    if(file.size > 5 * 1024 * 1024){

        showMessage(
            'The selected photo is larger than 5MB. Please choose a smaller photo.',
            'error'
        );

        clearSelectedPhoto();
        return;
    }

    selectedPhoto = file;

    selectedFile.textContent =
        'Selected: ' +
        (file.name || 'Camera photo');

    /*
     * FileReader is supported by modern Android/iOS browsers
     * and gives an immediate preview without uploading first.
     */
    const reader =
        new FileReader();

    reader.onload = function(event){

        previewImage.src =
            event.target.result;

        photoPreview.classList.add(
            'show'
        );

    };

    reader.onerror = function(){

        showMessage(
            'The photo could not be previewed. Please try another image.',
            'error'
        );

    };

    reader.readAsDataURL(file);

    clearMessage();
}

function clearSelectedPhoto(){

    selectedPhoto = null;

    cameraInput.value = '';
    storageInput.value = '';

    previewImage.src = '';
    selectedFile.textContent = '';

    photoPreview.classList.remove('show');
}

function removePhoto(){
    clearSelectedPhoto();
}

function showMessage(text, type){

    message.textContent = text;
    message.className = 'message ' + type;
}

function clearMessage(){

    message.textContent = '';
    message.className = 'message';
}

/*
 * CANCEL
 *
 * Calls logout.php if available, then always returns
 * to screen2.html.
 */
async function cancelProfile(){

    if(!confirm('Cancel profile setup and return to login?')){
        return;
    }

    try{
        await fetch('logout.php', {
            method: 'GET',
            credentials: 'same-origin',
            cache: 'no-store'
        });
    }catch(e){
        console.log('Logout request:', e);
    }

    window.location.href = 'screen2.html';
}

/*
 * SAVE
 */
form.addEventListener('submit', async function(e){

    e.preventDefault();

    if(!form.checkValidity()){
        form.reportValidity();
        return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    showMessage(
        'Saving your doctor profile...',
        'loading'
    );

    const formData = new FormData(form);

    /*
     * IMPORTANT:
     * The camera and storage inputs have different names so
     * we don't rely on browser-specific handling of input.files.
     *
     * The backend receives one normalized field:
     * $_FILES['photo']
     */
    formData.delete('camera_photo');
    formData.delete('storage_photo');
    if (selectedPhoto) {
        formData.append(
            'photo',
            selectedPhoto,
            selectedPhoto.name || 'doctor_profile.jpg'
        );
    }

    try{

        const response = await fetch(
            'doctor_profile_setup.php',
            {
                method: 'POST',
                body: formData,
                credentials: 'same-origin',
                cache: 'no-store'
            }
        );

        const text = await response.text();

        let result;

        try{
            result = JSON.parse(text);
        }catch(error){

            console.error('Server response:', text);

            throw new Error(
                'The server returned an invalid response.'
            );
        }

        if(!response.ok || !result.success){

            throw new Error(
                result.message ||
                'Unable to save doctor profile.'
            );
        }

        showMessage(
            result.message ||
            'Doctor profile saved successfully.',
            'success'
        );

        saveBtn.textContent = 'Saved ✓';

        /*
         * Backend destroys the session.
         * Then return to screen2.html.
         */
        setTimeout(function(){

            window.location.href =
                result.redirect || 'screen2.html';

        }, 900);

    }catch(error){

        console.error(
            'Doctor profile save error:',
            error
        );

        showMessage(
            error.message ||
            'Unable to save the profile.',
            'error'
        );

        saveBtn.disabled = false;
        saveBtn.textContent = '✓ Save Profile';
    }

});
</script>

</body>
</html>
